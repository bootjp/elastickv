on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      time-limit:
        description: "Workload runtime seconds"
        required: false
        default: "300"
      long-fuse-run:
        description: "Run strict FUSE Jepsen workloads for 30 minutes"
        type: boolean
        required: false
        default: false
      rate:
        description: "Ops/sec per worker"
        required: false
        default: "5"
      concurrency:
        description: "Number of worker threads (must be multiple of 4 for S3)"
        required: false
        default: "4"
      key-count:
        description: "Number of distinct keys per workload"
        required: false
        default: "8"
      max-writes-per-key:
        description: "Maximum writes per key before exhaustion"
        required: false
        default: "150"
      max-txn-length:
        description: "Maximum micro-ops per transaction"
        required: false
        default: "4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-jepsen-scheduled

name: Jepsen Scheduled Stress Test
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.workload }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workload:
          - unit
          - redis
          - redis-zset
          - dynamodb
          - dynamodb-type-string
          - dynamodb-type-number
          - dynamodb-type-binary
          - dynamodb-type-bool
          - dynamodb-type-null
          - dynamodb-type-string-set
          - dynamodb-type-number-set
          - dynamodb-type-binary-set
          - dynamodb-type-list
          - dynamodb-type-map
          - s3
          - filesystem-cross-mount
          - filesystem-sqlite-check
          - filesystem-node-crash
          - filesystem-benchmark
          - filesystem-benchmark-legacy
          - filesystem-benchmark-multigroup
          - filesystem-benchmark-multigroup-legacy
          - filesystem-overwrite
          - filesystem-rename
          - sqlite
    env:
      GOCACHE: /tmp/go-build
      WORKLOAD: ${{ matrix.workload }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install netcat, graphviz and fuse3
        # fuse3 provides fusermount3 for the --filesystemMount nodes used by
        # the filesystem Jepsen workload.
        run: sudo apt-get update && sudo apt-get install -y netcat-openbsd graphviz fuse3 sqlite3
      - name: Install Leiningen
        run: |
          curl -L https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein > ~/lein
          chmod +x ~/lein
          ~/lein version
      # Cache Maven artifacts across runs. Maven Central (repo1.maven.org)
      # serves intermittent 429s during dependency download, which
      # uncached scheduled runs trip frequently — the lein project pulls
      # ~100 jars at first launch. Keying on project.clj invalidates the
      # cache only when dependencies actually change.
      - name: Cache Maven and Leiningen artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.lein
          key: ${{ runner.os }}-maven-${{ hashFiles('jepsen/project.clj') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Pre-fetch Go modules and build binaries
        if: matrix.workload != 'unit'
        run: |
          mkdir -p "$GOCACHE" /tmp/go-tmp
          export GOCACHE GOTMPDIR=/tmp/go-tmp
          go mod download
          case "$WORKLOAD" in
            filesystem-*|sqlite) go build -o /tmp/elastickv-bin . ;;
            *) go build -o /tmp/elastickv-demo ./cmd/server ;;
          esac
      # Warm the Maven cache up front so unit tests / workloads start
      # against a populated ~/.m2. `lein deps` is wrapped with a retry
      # loop because Maven Central transiently returns 429 during peak
      # hours, and the default lein behaviour is to fail the build on
      # the first checksum miss. Three attempts with linear backoff is
      # enough to ride out a typical rate-limit window.
      - name: Warm Leiningen Maven cache
        working-directory: jepsen
        run: |
          set -uo pipefail
          n=0
          max=3
          until ~/lein deps; do
            n=$((n + 1))
            if [ "$n" -ge "$max" ]; then
              echo "lein deps failed after $n attempts" >&2
              exit 1
            fi
            sleep_secs=$((n * 30))
            echo "lein deps failed (attempt $n/$max), retrying in ${sleep_secs}s..." >&2
            sleep "$sleep_secs"
          done
      - name: Run Jepsen unit tests
        if: matrix.workload == 'unit'
        working-directory: jepsen
        run: ~/lein test
      - name: Launch demo cluster
        if: matrix.workload != 'unit' && !startsWith(matrix.workload, 'filesystem-') && matrix.workload != 'sqlite'
        run: |
          set -euo pipefail
          nohup /tmp/elastickv-demo > /tmp/elastickv-demo.log 2>&1 &
          echo $! > /tmp/elastickv-demo.pid

          echo "Waiting for redis (63791-63793), dynamo (63801-63803), and s3 (63901-63903) listeners..."
          for _ in {1..90}; do
            if nc -z 127.0.0.1 63791 && nc -z 127.0.0.1 63792 && nc -z 127.0.0.1 63793 \
              && nc -z 127.0.0.1 63801 && nc -z 127.0.0.1 63802 && nc -z 127.0.0.1 63803 \
              && nc -z 127.0.0.1 63901 && nc -z 127.0.0.1 63902 && nc -z 127.0.0.1 63903; then
              echo "Cluster is up"
              exit 0
            fi
            sleep 1
          done

          echo "Demo cluster failed to start; dumping log:"
          tail -n 200 /tmp/elastickv-demo.log || true
          exit 1
      - name: Run Redis Jepsen workload against elastickv
        if: matrix.workload == 'redis'
        working-directory: jepsen
        timeout-minutes: 70
        run: |
          timeout 3600 ~/lein run -m elastickv.redis-workload \
            --time-limit ${{ inputs.time-limit || '300' }} \
            --rate ${{ inputs.rate || '10' }} \
            --concurrency ${{ inputs.concurrency || '8' }} \
            --key-count ${{ inputs.key-count || '16' }} \
            --max-writes-per-key ${{ inputs.max-writes-per-key || '250' }} \
            --max-txn-length ${{ inputs.max-txn-length || '4' }} \
            --ports 63791,63792,63793 \
            --host 127.0.0.1
      - name: Run Redis ZSet safety Jepsen workload against elastickv
        if: matrix.workload == 'redis-zset'
        working-directory: jepsen
        timeout-minutes: 70
        run: |
          timeout 3600 ~/lein run -m elastickv.redis-zset-safety-workload \
            --time-limit ${{ inputs.time-limit || '300' }} \
            --rate ${{ inputs.rate || '10' }} \
            --concurrency ${{ inputs.concurrency || '8' }} \
            --ports 63791,63792,63793 \
            --host 127.0.0.1
      - name: Run DynamoDB Jepsen workload against elastickv
        if: matrix.workload == 'dynamodb'
        working-directory: jepsen
        timeout-minutes: 70
        run: |
          timeout 3600 ~/lein run -m elastickv.dynamodb-workload --local \
            --time-limit ${{ inputs.time-limit || '300' }} \
            --rate ${{ inputs.rate || '10' }} \
            --concurrency ${{ inputs.concurrency || '8' }} \
            --key-count ${{ inputs.key-count || '16' }} \
            --max-writes-per-key ${{ inputs.max-writes-per-key || '250' }} \
            --max-txn-length ${{ inputs.max-txn-length || '4' }} \
            --dynamo-ports 63801,63802,63803 \
            --host 127.0.0.1
      - name: Run DynamoDB per-type Jepsen workload against elastickv
        if: startsWith(matrix.workload, 'dynamodb-type-')
        working-directory: jepsen
        # Each attribute type uses a fresh cluster on its own runner.
        timeout-minutes: 6
        env:
          TYPE_TL: "60"
          TYPE_CONCURRENCY: "4"
          TYPE_KEY_COUNT: "8"
          TYPE_MAX_WRITES: "80"
        run: |
          PER_TYPE_TIMEOUT=$((TYPE_TL + 180))
          TYPE="${WORKLOAD#dynamodb-type-}"
          timeout "${PER_TYPE_TIMEOUT}" ~/lein run -m elastickv.dynamodb-types-workload --local \
            --time-limit "${TYPE_TL}" \
            --rate ${{ inputs.rate || '5' }} \
            --concurrency "${TYPE_CONCURRENCY}" \
            --key-count "${TYPE_KEY_COUNT}" \
            --max-writes-per-key "${TYPE_MAX_WRITES}" \
            --value-type "${TYPE}" \
            --dynamo-ports 63801,63802,63803 \
            --host 127.0.0.1
      - name: Run S3 Jepsen workload against elastickv
        if: matrix.workload == 's3'
        working-directory: jepsen
        timeout-minutes: 70
        run: |
          timeout 3600 ~/lein run -m elastickv.s3-workload --local \
            --time-limit ${{ inputs.time-limit || '300' }} \
            --rate ${{ inputs.rate || '10' }} \
            --concurrency ${{ inputs.concurrency || '8' }} \
            --key-count ${{ inputs.key-count || '16' }} \
            --max-writes-per-key ${{ inputs.max-writes-per-key || '250' }} \
            --threads-per-key 4 \
            --s3-ports 63901,63902,63903 \
            --host 127.0.0.1
      - name: Launch filesystem cluster
        if: startsWith(matrix.workload, 'filesystem-') || matrix.workload == 'sqlite'
        # Mirrors the cluster in jepsen-test.yml: every node mounts the shared
        # filesystem so the workload drives leader and follower mounts alike,
        # and the root directory is owned by the runner user because the
        # mount enforces default_permissions.
        run: |
          set -euo pipefail
          mkdir -p /tmp/elastickv-fs
          BOOTSTRAP_MEMBERS="n1=127.0.0.1:50051,n2=127.0.0.1:50052,n3=127.0.0.1:50053"
          RAFT_REDIS_MAP="127.0.0.1:50051=127.0.0.1:63791,127.0.0.1:50052=127.0.0.1:63792,127.0.0.1:50053=127.0.0.1:63793"
          RAFT_S3_MAP="127.0.0.1:50051=127.0.0.1:63901,127.0.0.1:50052=127.0.0.1:63902,127.0.0.1:50053=127.0.0.1:63903"
          RAFT_DYNAMO_MAP="127.0.0.1:50051=127.0.0.1:63801,127.0.0.1:50052=127.0.0.1:63802,127.0.0.1:50053=127.0.0.1:63803"
          STRICT_FLAGS=(--filesystemStrict)
          if [[ "$WORKLOAD" == 'filesystem-benchmark-legacy' || "$WORKLOAD" == 'filesystem-benchmark-multigroup-legacy' ]]; then
            STRICT_FLAGS=()
          fi

          if [[ "$WORKLOAD" == 'filesystem-benchmark-multigroup' || "$WORKLOAD" == 'filesystem-benchmark-multigroup-legacy' ]]; then
            mkdir -p /tmp/elastickv-fs/fs-n1
            nohup /tmp/elastickv-bin \
              --address "127.0.0.1:50051" \
              --redisAddress "" --dynamoAddress "" --s3Address "" --sqsAddress "" \
              --filesystemMount /tmp/elastickv-fs/fs-n1 \
              "${STRICT_FLAGS[@]}" \
              --filesystemRootUID "$(id -u)" \
              --filesystemRootGID "$(id -g)" \
              --metricsAddress "" --pprofAddress "" \
              --raftId n1 --raftDataDir /tmp/elastickv-fs/n1 --raftBootstrap \
              --raftGroups "1=127.0.0.1:50051,2=127.0.0.1:50054" \
              --shardRanges ':!fs|op|=1,!fs|op|:=2' \
              > /tmp/elastickv-fs-n1.log 2>&1 &
            echo $! > /tmp/elastickv-fs.pid
            for _ in {1..90}; do
              if ! kill -0 "$(cat /tmp/elastickv-fs.pid)" 2>/dev/null; then
                echo "Two-group filesystem process exited before readiness" >&2
                tail -n 200 /tmp/elastickv-fs-n1.log || true
                exit 1
              fi
              if nc -z 127.0.0.1 50051 && nc -z 127.0.0.1 50054 \
                && mountpoint -q /tmp/elastickv-fs/fs-n1 \
                && stat /tmp/elastickv-fs/fs-n1 >/dev/null; then
                echo "Two-group filesystem cluster is up"
                exit 0
              fi
              sleep 1
            done
            tail -n 200 /tmp/elastickv-fs-n1.log || true
            exit 1
          fi

          : > /tmp/elastickv-fs.pid
          for node in 1 2 3; do
            mkdir -p "/tmp/elastickv-fs/fs-n${node}"
            nohup /tmp/elastickv-bin \
              --address "127.0.0.1:5005${node}" \
              --redisAddress "127.0.0.1:6379${node}" \
              --dynamoAddress "127.0.0.1:6380${node}" \
              --s3Address "127.0.0.1:6390${node}" \
              --filesystemMount "/tmp/elastickv-fs/fs-n${node}" \
              "${STRICT_FLAGS[@]}" \
              --filesystemRootUID "$(id -u)" \
              --filesystemRootGID "$(id -g)" \
              --metricsAddress "" \
              --pprofAddress "" \
              --raftId "n${node}" \
              --raftDataDir "/tmp/elastickv-fs/n${node}" \
              --raftBootstrapMembers "$BOOTSTRAP_MEMBERS" \
              --raftRedisMap "$RAFT_REDIS_MAP" \
              --raftS3Map "$RAFT_S3_MAP" \
              --raftDynamoMap "$RAFT_DYNAMO_MAP" \
              > "/tmp/elastickv-fs-n${node}.log" 2>&1 &
            echo $! >> /tmp/elastickv-fs.pid
          done

          echo "Waiting for redis (63791-63793) listeners and FUSE mounts..."
          for _ in {1..90}; do
            if nc -z 127.0.0.1 63791 && nc -z 127.0.0.1 63792 && nc -z 127.0.0.1 63793 \
              && mountpoint -q /tmp/elastickv-fs/fs-n1 && mountpoint -q /tmp/elastickv-fs/fs-n2 \
              && mountpoint -q /tmp/elastickv-fs/fs-n3; then
              echo "Filesystem cluster is up"
              exit 0
            fi
            sleep 1
          done

          echo "Filesystem cluster failed to start; dumping logs:"
          for node in 1 2 3; do
            tail -n 200 "/tmp/elastickv-fs-n${node}.log" || true
          done
          exit 1
      - name: Verify FUSE cross-mount disjoint writes without client retries
        if: matrix.workload == 'filesystem-cross-mount'
        run: |
          python3 scripts/test-fuse-cross-mount.py \
            /tmp/elastickv-fs/fs-n1 \
            /tmp/elastickv-fs/fs-n2 \
            /tmp/elastickv-fs/fs-n3 \
            --iterations 50
      - name: Verify SQLite rollback journals without client retries
        if: matrix.workload == 'filesystem-sqlite-check'
        run: python3 scripts/test-fuse-sqlite.py /tmp/elastickv-fs/fs-n1 --writes 30
      - name: Verify strict FUSE fsync after Raft node crash
        if: matrix.workload == 'filesystem-node-crash'
        timeout-minutes: 5
        run: |
          python3 scripts/test-fuse-node-crash.py \
            /tmp/elastickv-fs/fs-n1 \
            /tmp/elastickv-fs/fs-n2 \
            /tmp/elastickv-fs/fs-n3 \
            --pid-file /tmp/elastickv-fs.pid \
            --restart-log /tmp/elastickv-fs-n1-restarted.log
      - name: Measure FUSE write and fsync latency
        if: matrix.workload == 'filesystem-benchmark' || matrix.workload == 'filesystem-benchmark-legacy' || matrix.workload == 'filesystem-benchmark-multigroup' || matrix.workload == 'filesystem-benchmark-multigroup-legacy'
        timeout-minutes: 10
        run: |
          python3 scripts/test_benchmark_fuse.py
          MODE=strict
          if [[ "$WORKLOAD" == 'filesystem-benchmark-legacy' || "$WORKLOAD" == 'filesystem-benchmark-multigroup-legacy' ]]; then MODE=legacy; fi
          LAYOUT=single-group
          if [[ "$WORKLOAD" == 'filesystem-benchmark-multigroup' || "$WORKLOAD" == 'filesystem-benchmark-multigroup-legacy' ]]; then LAYOUT=two-group; fi
          python3 scripts/benchmark-fuse.py /tmp/elastickv-fs/fs-n1 \
            --mode "$MODE" --layout "$LAYOUT" --writes 40 --workers 4 --repetitions 3 \
            --output /tmp/elastickv-fuse-benchmark.json
      - name: Upload FUSE benchmark results
        if: matrix.workload == 'filesystem-benchmark' || matrix.workload == 'filesystem-benchmark-legacy' || matrix.workload == 'filesystem-benchmark-multigroup' || matrix.workload == 'filesystem-benchmark-multigroup-legacy'
        uses: actions/upload-artifact@v7
        with:
          name: elastickv-fuse-benchmark-${{ matrix.workload }}
          path: /tmp/elastickv-fuse-benchmark.json
          retention-days: 14
      - name: Run filesystem Jepsen workload against elastickv
        if: matrix.workload == 'filesystem-overwrite' || matrix.workload == 'filesystem-rename'
        working-directory: jepsen
        # Each write mode uses a fresh filesystem cluster on its own runner.
        # The scheduled run keeps enough bounded registers to exercise strict
        # mutations for the full 30-minute workload. See filesystem_budget.sh.
        timeout-minutes: 70
        env:
          FS_TIME_LIMIT: ${{ (github.event_name == 'schedule' || inputs.long-fuse-run) && '1800' || inputs.time-limit || '300' }}
          FS_RATE: ${{ (github.event_name == 'schedule' || inputs.long-fuse-run) && '1' || inputs.rate || '10' }}
          FS_REQUESTED_KEYS: ${{ (github.event_name == 'schedule' || inputs.long-fuse-run) && '512' || inputs.key-count || '16' }}
          FS_REQUESTED_WRITES: ${{ (github.event_name == 'schedule' || inputs.long-fuse-run) && '16' || inputs.max-writes-per-key || '250' }}
        run: |
          # Knossos checks each register independently. Bound each history's
          # ambiguous writes while keeping the requested total write budget.
          valid_java_positive_int() {
            [[ "$1" =~ ^[1-9][0-9]*$ ]] || return 1
            [[ ${#1} -lt 10 ]] && return 0
            [[ ${#1} -eq 10 ]] || return 1
            (( 10#$1 <= 2147483647 ))
          }
          if ! valid_java_positive_int "$FS_REQUESTED_KEYS" || ! valid_java_positive_int "$FS_REQUESTED_WRITES"; then
            echo "key-count and max-writes-per-key must be positive 32-bit integers" >&2
            exit 1
          fi
          bash test/filesystem_budget_test.sh
          source ./filesystem_budget.sh
          MODE="${WORKLOAD#filesystem-}"
          filesystem_budget "$MODE" "$FS_REQUESTED_KEYS" "$FS_REQUESTED_WRITES"
          echo "Filesystem register budget: ${FS_KEY_COUNT} keys, ${FS_MAX_WRITES} writes per key"
          timeout 3600 ~/lein run -m elastickv.filesystem-workload --local \
            --time-limit "$FS_TIME_LIMIT" \
            --rate "$FS_RATE" \
            --concurrency ${{ inputs.concurrency || '8' }} \
            --key-count "$FS_KEY_COUNT" \
            --max-writes-per-key "$FS_MAX_WRITES" \
            --write-mode "$MODE" \
            --mount-dirs /tmp/elastickv-fs/fs-n1,/tmp/elastickv-fs/fs-n2,/tmp/elastickv-fs/fs-n3
      - name: Run SQLite Jepsen workload on FUSE
        if: matrix.workload == 'sqlite'
        working-directory: jepsen
        timeout-minutes: 70
        env:
          FS_TIME_LIMIT: ${{ (github.event_name == 'schedule' || inputs.long-fuse-run) && '1800' || inputs.time-limit || '300' }}
          FS_RATE: ${{ (github.event_name == 'schedule' || inputs.long-fuse-run) && '0.25' || inputs.rate || '10' }}
          SQLITE_REQUESTED_KEYS: ${{ (github.event_name == 'schedule' || inputs.long-fuse-run) && '128' || '24' }}
          SQLITE_REQUESTED_WRITES: ${{ (github.event_name == 'schedule' || inputs.long-fuse-run) && '16' || '64' }}
        run: |
          # Spread the longer run across databases while bounding the
          # ambiguous writes Knossos must explore for any one database.
          bash test/sqlite_budget_test.sh
          source ./sqlite_budget.sh
          sqlite_budget "$SQLITE_REQUESTED_KEYS" "$SQLITE_REQUESTED_WRITES"
          echo "SQLite register budget: ${SQLITE_KEY_COUNT} keys, ${SQLITE_MAX_WRITES} writes per key"
          timeout 3600 ~/lein run -m elastickv.sqlite-workload --local \
            --time-limit "$FS_TIME_LIMIT" \
            --rate "$FS_RATE" \
            --concurrency 8 --key-count "$SQLITE_KEY_COUNT" --max-writes-per-key "$SQLITE_MAX_WRITES" \
            --mount-dirs /tmp/elastickv-fs/fs-n1,/tmp/elastickv-fs/fs-n2,/tmp/elastickv-fs/fs-n3
      - name: Archive Jepsen history
        if: always() && matrix.workload != 'unit'
        run: bash scripts/archive-jepsen-store.sh jepsen/store /tmp/jepsen-store-types.tar.gz
      - name: Upload Jepsen history
        if: always() && matrix.workload != 'unit'
        uses: actions/upload-artifact@v7
        with:
          name: jepsen-store-${{ matrix.workload }}
          path: /tmp/jepsen-store-types.tar.gz
          retention-days: 7
          if-no-files-found: ignore
      - name: Dump demo cluster log on failure
        if: failure() && matrix.workload != 'unit' && !startsWith(matrix.workload, 'filesystem-') && matrix.workload != 'sqlite'
        # The previous `tail -n 500` truncated a 3-minute workload's
        # log down to startup-only lines, making it impossible to
        # correlate a Jepsen anomaly with the server-side state
        # (start_ts, commit_ts, raft term, write conflicts, lock-
        # resolver events). Print head + tail inline so the GH UI
        # still shows the most recent activity at-a-glance, then
        # upload the full log as an artifact for offline analysis.
        run: |
          echo "=== first 200 lines (startup) ==="
          head -n 200 /tmp/elastickv-demo.log || true
          echo "=== last 1000 lines (most recent activity) ==="
          tail -n 1000 /tmp/elastickv-demo.log || true
          echo "=== full log line count ==="
          wc -l /tmp/elastickv-demo.log || true
      - name: Upload demo cluster log on failure
        if: failure() && matrix.workload != 'unit' && !startsWith(matrix.workload, 'filesystem-') && matrix.workload != 'sqlite'
        uses: actions/upload-artifact@v7
        with:
          name: elastickv-demo-log-${{ matrix.workload }}
          path: /tmp/elastickv-demo.log
          retention-days: 14
          if-no-files-found: warn
      - name: Dump filesystem cluster logs on failure
        if: failure() && (startsWith(matrix.workload, 'filesystem-') || matrix.workload == 'sqlite')
        run: |
          for node in n1 n2 n3; do
            log=/tmp/elastickv-fs-${node}.log
            [ -f "$log" ] || continue
            echo "=== ${node}: first 200 lines (startup) ==="
            head -n 200 "$log" || true
            echo "=== ${node}: last 500 lines (most recent activity) ==="
            tail -n 500 "$log" || true
            echo "=== ${node}: full log line count ==="
            wc -l "$log" || true
          done
          tail -n 200 /tmp/elastickv-fs-n1-restarted.log || true
      - name: Upload filesystem cluster logs on failure
        if: failure() && (startsWith(matrix.workload, 'filesystem-') || matrix.workload == 'sqlite')
        uses: actions/upload-artifact@v7
        with:
          name: elastickv-fs-logs-${{ matrix.workload }}
          path: |
            /tmp/elastickv-fs-n1.log
            /tmp/elastickv-fs-n2.log
            /tmp/elastickv-fs-n3.log
            /tmp/elastickv-fs-n1-restarted.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Stop demo cluster
        if: always()
        run: |
          if [ -f /tmp/elastickv-demo.pid ]; then
            pid=$(cat /tmp/elastickv-demo.pid)
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
      - name: Stop filesystem cluster
        if: always()
        run: |
          if [ -f /tmp/elastickv-fs.pid ]; then
            while read -r pid; do
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            done < /tmp/elastickv-fs.pid
          fi
          for node in 1 2 3; do
            fusermount3 -uz "/tmp/elastickv-fs/fs-n${node}" 2>/dev/null || true
          done
