name: go-mod-fix
on:
  push:
    branches:
      - renovate/*

# No fallback: module downloads must pass the malware blocklist.
env:
  GOPROXY: https://golang.flatt.tech

jobs:
  go-mod-fix:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: fix
        uses: at-wat/go-sum-fix-action@v0
        with:
          git_user: bootjp
          git_email: public@bootjp.me
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_style: squash
          push: force
