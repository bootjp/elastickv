on: [ push ]

# どこのテストで失敗するようになったのかを特定するために、
# pull request とは別に、push に対してもテストを実行する。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-go-test-push
#  cancel-in-progress: true

name: Test
permissions:
  contents: read
jobs:
  shard:
    name: test shard (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        # Package shards run as parallel jobs; scripts/go-test-shard.sh
        # defines which packages each shard covers.
        shard: [adapter, adapter-seq, root, raft-crypto, rest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install fuse3 and sqlite3
        # fusermount3 lets the FUSE end-to-end tests mount without root
        # (internal/filesystem/fuseadapter, TestMountFilesystemServiceServesKernelMount).
        run: sudo apt-get update && sudo apt-get install -y fuse3 sqlite3
      - name: Reject production imports of test support
        if: matrix.shard == 'rest'
        run: bash scripts/check-production-imports.sh
      - name: Run race tests
        run: bash scripts/go-test-shard.sh "${{ matrix.shard }}"
        env:
          # Fail, rather than skip, the kernel-mount tests when FUSE is unusable.
          ELASTICKV_REQUIRE_FUSE: "1"
          ELASTICKV_REQUIRE_SQLITE: "1"
  # Branch protection requires the "test (ubuntu-latest)" check, so this
  # job keeps that name and passes only when every shard passed.
  test:
    name: test (ubuntu-latest)
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all shards to pass
        run: test "${{ needs.shard.result }}" = success
