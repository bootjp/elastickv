on: [ push ]

# どこのテストで失敗するようになったのかを特定するために、
# pull request とは別に、push に対してもテストを実行する。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-go-test-push
#  cancel-in-progress: true

name: Test
permissions:
  contents: read
jobs:
  test:
    env:
      GRPC_SEQUENCE_TESTS: '^(Test_consistency_satisfy_write_after_read_sequence|Test_grpc_transaction)$'
      RAFT_NATIVE_MEMORY_TESTS: '^(TestMigrationQuorumCommitFollowsForcedLeadershipTransfer|TestMigrationQuorumPartitionAcceptance|TestEnginePipelineNativeEncryptedLargeQuorumSnapshotRestart)$'
    strategy:
      matrix:
        os: [ [ubuntu-latest] ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install fuse3 and sqlite3
        # fusermount3 lets the FUSE end-to-end tests mount without root
        # (internal/filesystem/fuseadapter, TestMountFilesystemServiceServesKernelMount).
        run: sudo apt-get update && sudo apt-get install -y fuse3 sqlite3
      - name: Reject production imports of test support
        run: bash scripts/check-production-imports.sh
      - name: Run race tests outside dedicated large-value and gRPC phases
        run: go test -race -timeout=30m ./... -skip "$GRPC_SEQUENCE_TESTS|$RAFT_NATIVE_MEMORY_TESTS"
        env:
          # Fail, rather than skip, the kernel-mount tests when FUSE is unusable.
          ELASTICKV_REQUIRE_FUSE: "1"
          ELASTICKV_REQUIRE_SQLITE: "1"
      # The native 64-MiB quorum fixtures retain several replicas and race
      # shadow memory. Keep their original payloads, assertions and deadlines,
      # but do not run them concurrently with other packages' heavy fixtures.
      - name: Run native migration large-value race acceptance
        run: go test -race -timeout=30m ./adapter -run "$RAFT_NATIVE_MEMORY_TESTS"
      - name: Run encrypted native large-value race acceptance
        run: go test -race -timeout=30m ./internal/raftengine/etcd -run "$RAFT_NATIVE_MEMORY_TESTS"
      # These unchanged 10,000-iteration tests need a fresh package budget
      # after the serial migration/snapshot acceptance tests have finished.
      - name: Run full-length gRPC consistency sequences
        run: go test -race -timeout=30m ./adapter -run "$GRPC_SEQUENCE_TESTS"
