name: TLA+ model check

# Checks the Lean proofs and bounded TLC models for the affected subsystems.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tla/**'
      - 'lean/**'
      - 'Makefile'
      - 'kv/hlc*.go'
      - 'kv/tso*.go'
      - 'kv/coordinator.go'
      - 'kv/sharded_coordinator.go'
      - 'kv/transaction.go'
      - 'kv/fsm.go'
      - 'kv/fsm_cas.go'
      - 'kv/fsm_migration_cleanup.go'
      - 'kv/migration_version_identity.go'
      - 'kv/version_cas_*.go'
      - 'kv/fsm_migration_serving.go'
      - 'kv/lock_resolver.go'
      - 'store/mvcc_store.go'
      - 'store/lsm_store.go'
      - 'store/migration_cleanup.go'
      - 'store/raft_entry*.go'
      - 'adapter/ts.go'
      - 'scripts/tla-check.sh'
      - 'distribution/**'
      - '.github/workflows/tla-check.yml'
  push:
    branches: [main]
    paths:
      - 'tla/**'
      - 'lean/**'
      - 'Makefile'
      - 'kv/hlc*.go'
      - 'kv/tso*.go'
      - 'kv/coordinator.go'
      - 'kv/sharded_coordinator.go'
      - 'kv/transaction.go'
      - 'kv/fsm.go'
      - 'kv/fsm_cas.go'
      - 'kv/fsm_migration_cleanup.go'
      - 'kv/migration_version_identity.go'
      - 'kv/version_cas_*.go'
      - 'kv/fsm_migration_serving.go'
      - 'kv/lock_resolver.go'
      - 'store/mvcc_store.go'
      - 'store/lsm_store.go'
      - 'store/migration_cleanup.go'
      - 'store/raft_entry*.go'
      - 'adapter/ts.go'
      - 'scripts/tla-check.sh'
      - 'distribution/**'
      - '.github/workflows/tla-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-tla-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tla-check:
    name: tla-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Cache the checksum-pinned tla2tools.jar so we don't re-download
      # GitHub release artefacts on every run.  Key includes the Makefile
      # hash so a version-pin change invalidates the cache automatically
      # (TLA_VERSION + TLA_SHA256 both live in the Makefile).
      #
      # NO restore-keys: a prefix-match restore would bring back an older
      # jar after a TLA_VERSION/TLA_SHA256 bump.  Because the Makefile's
      # $(TLA_JAR) recipe is gated on file existence, the restored stale
      # jar would skip checksum verification entirely — defeating the
      # whole point of the pin (codex P2 on PR #856 round 4).  A full
      # miss-and-redownload is correct here.
      - name: Cache tla2tools.jar
        uses: actions/cache@v6
        with:
          path: .cache/tla
          key: ${{ runner.os }}-tla-tools-${{ hashFiles('Makefile') }}

      - name: Pre-fetch tla2tools.jar (logs separately from tla-check)
        run: make tla-tools

      - name: Run make tla-check
        run: make tla-check

  lean-check:
    name: lean-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install pinned Lean
        run: |
          version="$(cut -d: -f2 lean/lean-toolchain)"
          release="lean-${version#v}-linux"
          archive="$RUNNER_TEMP/$release.tar.zst"
          curl -fsSL "https://github.com/leanprover/lean4/releases/download/$version/$release.tar.zst" -o "$archive"
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/$release/bin" >> "$GITHUB_PATH"

      - name: Run make lean-check
        run: make lean-check
