on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-jepsen-test

name: Jepsen Test
permissions:
  contents: read
jobs:
  test:
    # Every workload runs twice: once against the cleartext cluster and
    # once against a data-at-rest encrypted one (file KEK, storage + raft
    # envelopes enabled before the first workload). Encryption is
    # consistency-transparent, so the encrypted leg is the acceptance
    # gate from docs/design/2026_04_29_partial_data_at_rest_encryption.md
    # §8.4 rather than a new workload.
    name: test (encryption=${{ matrix.encryption }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        encryption: ['off', 'on']
    env:
      GOCACHE: /tmp/go-build
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install netcat, graphviz and fuse3
        # fuse3 provides fusermount3 for the --filesystemMount nodes used by
        # the filesystem Jepsen workload.
        run: sudo apt-get update && sudo apt-get install -y netcat-openbsd graphviz fuse3 sqlite3 strace
      - name: Install Leiningen
        run: |
          curl -L https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein > ~/lein
          chmod +x ~/lein
          ~/lein version
      # See jepsen-test-scheduled.yml for the rationale: Maven Central
      # 429s during peak hours have been knocking the scheduled stress
      # run out, and the per-push run uses the same dependency set.
      - name: Cache Maven and Leiningen artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.lein
          key: ${{ runner.os }}-maven-${{ hashFiles('jepsen/project.clj') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Pre-fetch Go modules and build binary
        run: |
          mkdir -p "$GOCACHE" /tmp/go-tmp
          GOPATH=$(go env GOPATH)
          export GOCACHE GOTMPDIR=/tmp/go-tmp
          go mod download
          go build -o /tmp/elastickv-bin .
          go build -o /tmp/elastickv-admin-bin ./cmd/elastickv-admin
          go build -o /tmp/elastickv-raftadmin-bin ./cmd/raftadmin
      - name: Warm Leiningen Maven cache
        working-directory: jepsen
        run: |
          set -uo pipefail
          n=0
          max=3
          until ~/lein deps; do
            n=$((n + 1))
            if [ "$n" -ge "$max" ]; then
              echo "lein deps failed after $n attempts" >&2
              exit 1
            fi
            sleep_secs=$((n * 30))
            echo "lein deps failed (attempt $n/$max), retrying in ${sleep_secs}s..." >&2
            sleep "$sleep_secs"
          done
      - name: Run Jepsen unit tests
        working-directory: jepsen
        run: ~/lein test
      - name: Test Jepsen evidence archiving
        run: bash scripts/test-archive-jepsen-store.sh
      - name: Launch etcd-backed cluster
        run: |
          set -euo pipefail
          mkdir -p /tmp/elastickv-ci
          BOOTSTRAP_MEMBERS="n1=127.0.0.1:50051,n2=127.0.0.1:50052,n3=127.0.0.1:50053"
          RAFT_REDIS_MAP="127.0.0.1:50051=127.0.0.1:63791,127.0.0.1:50052=127.0.0.1:63792,127.0.0.1:50053=127.0.0.1:63793"
          RAFT_S3_MAP="127.0.0.1:50051=127.0.0.1:63901,127.0.0.1:50052=127.0.0.1:63902,127.0.0.1:50053=127.0.0.1:63903"
          # No raftDynamoMap: DynamoDB workloads must exercise follower gRPC
          # forwarding and leader-issued seals instead of HTTP leader proxying.
          RAFT_SQS_MAP="127.0.0.1:50051=127.0.0.1:63501,127.0.0.1:50052=127.0.0.1:63502,127.0.0.1:50053=127.0.0.1:63503"

          # Encrypted leg: one random owner-only file KEK shared by the
          # three nodes; the cutover runs in the next step once the
          # cluster is up. Node data dirs must exist before start-up so
          # the sidecar path's directory is writable.
          ENC_ARGS=()
          if [ "${{ matrix.encryption }}" = "on" ]; then
            head -c 32 /dev/urandom > /tmp/elastickv-ci/kek.bin
            chmod 600 /tmp/elastickv-ci/kek.bin
          fi

          : > /tmp/elastickv-demo.pid
          for node in 1 2 3; do
            if [ "${{ matrix.encryption }}" = "on" ]; then
              mkdir -p "/tmp/elastickv-ci/n${node}"
              ENC_ARGS=(--encryption-enabled --kekFile /tmp/elastickv-ci/kek.bin \
                        --encryptionSidecarPath "/tmp/elastickv-ci/n${node}/keys.json")
            fi
            # Every node mounts the shared filesystem so the filesystem
            # workload can drive leader and follower mounts alike. The root
            # directory is owned by the runner user: the mount enforces
            # default_permissions, so a root-owned root would reject the
            # workload's mkdir.
            mkdir -p "/tmp/elastickv-ci/fs-n${node}"
            nohup /tmp/elastickv-bin \
              --address "127.0.0.1:5005${node}" \
              --redisAddress "127.0.0.1:6379${node}" \
              --dynamoAddress "127.0.0.1:6380${node}" \
              --s3Address "127.0.0.1:6390${node}" \
              --sqsAddress "127.0.0.1:6350${node}" \
              --filesystemMount "/tmp/elastickv-ci/fs-n${node}" \
              --filesystemRootUID "$(id -u)" \
              --filesystemRootGID "$(id -g)" \
              --metricsAddress "" \
              --pprofAddress "" \
              --raftId "n${node}" \
              --raftDataDir "/tmp/elastickv-ci/n${node}" \
              --raftBootstrapMembers "$BOOTSTRAP_MEMBERS" \
              --raftRedisMap "$RAFT_REDIS_MAP" \
              --raftS3Map "$RAFT_S3_MAP" \
              --raftSqsMap "$RAFT_SQS_MAP" \
              "${ENC_ARGS[@]}" \
              > "/tmp/elastickv-demo-n${node}.log" 2>&1 &
            echo $! >> /tmp/elastickv-demo.pid
          done

          echo "Waiting for redis (63791-63793), dynamo (63801-63803), s3 (63901-63903), sqs (63501-63503) listeners and FUSE mounts..."
          for i in {1..90}; do
            if nc -z 127.0.0.1 63791 && nc -z 127.0.0.1 63792 && nc -z 127.0.0.1 63793 \
              && nc -z 127.0.0.1 63801 && nc -z 127.0.0.1 63802 && nc -z 127.0.0.1 63803 \
              && nc -z 127.0.0.1 63901 && nc -z 127.0.0.1 63902 && nc -z 127.0.0.1 63903 \
              && nc -z 127.0.0.1 63501 && nc -z 127.0.0.1 63502 && nc -z 127.0.0.1 63503 \
              && mountpoint -q /tmp/elastickv-ci/fs-n1 && mountpoint -q /tmp/elastickv-ci/fs-n2 \
              && mountpoint -q /tmp/elastickv-ci/fs-n3; then
              echo "Cluster is up"
              exit 0
            fi
            sleep 1
          done

          echo "Demo cluster failed to start; dumping log:"
          tail -n 200 /tmp/elastickv-demo-n1.log || true
          tail -n 200 /tmp/elastickv-demo-n2.log || true
          tail -n 200 /tmp/elastickv-demo-n3.log || true
          exit 1
      - name: Enable data-at-rest encryption on the cluster
        if: matrix.encryption == 'on'
        # Bootstrap the DEK pair, then flip the storage and raft envelope
        # cluster flags (§7.1 Phase 1 + Phase 2) and wait until every
        # member reports them active, so every workload below runs
        # against encrypted storage and encrypted Raft entries.
        timeout-minutes: 3
        run: |
          scripts/jepsen-enable-encryption.sh /tmp/elastickv-admin-bin /tmp/elastickv-ci/kek.bin \
            127.0.0.1:50051 127.0.0.1:50052 127.0.0.1:50053
      - name: Run Redis Jepsen workload against elastickv
        working-directory: jepsen
        timeout-minutes: 3
        run: |
          timeout 120 ~/lein run -m elastickv.redis-workload --time-limit 5 --rate 5 --concurrency 5 --ports 63791,63792,63793 --host 127.0.0.1
      - name: Run Redis ZSet safety Jepsen workload against elastickv
        working-directory: jepsen
        timeout-minutes: 3
        run: |
          timeout 120 ~/lein run -m elastickv.redis-zset-safety-workload --time-limit 5 --rate 5 --concurrency 5 --ports 63791,63792,63793 --host 127.0.0.1
      - name: Run DynamoDB Jepsen workload against elastickv
        working-directory: jepsen
        timeout-minutes: 3
        run: |
          timeout 120 ~/lein run -m elastickv.dynamodb-workload --local --time-limit 5 --rate 5 --concurrency 5 --dynamo-ports 63801,63802,63803 --host 127.0.0.1
      - name: Run DynamoDB seal workload with recorded leader changes
        working-directory: jepsen
        run: |
          printf 'run_sha=%s\n' "$GITHUB_SHA" > /tmp/dynamodb-seal-source.txt
          timeout 150 ~/lein run -m elastickv.dynamodb-seal-workload --local \
            --time-limit 15 --rate 30 --concurrency 9 --max-txn-length 4 \
            --dynamo-ports 63801,63802,63803 --host 127.0.0.1 \
            --raftadmin-bin /tmp/elastickv-raftadmin-bin \
            --raft-addresses 127.0.0.1:50051,127.0.0.1:50052,127.0.0.1:50053 \
            --leader-change-interval 2
      - name: Archive DynamoDB seal acceptance history
        if: always()
        run: bash scripts/archive-jepsen-store.sh jepsen/store/elastickv-dynamodb-snapshot-seal /tmp/dynamodb-seal-history.tar.gz
      - name: Upload DynamoDB seal acceptance history
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dynamodb-seal-encryption-${{ matrix.encryption }}
          path: |
            /tmp/dynamodb-seal-history.tar.gz
            /tmp/dynamodb-seal-source.txt
          retention-days: 7
          if-no-files-found: ignore
      - name: Run DynamoDB per-type Jepsen workloads against elastickv
        working-directory: jepsen
        timeout-minutes: 10
        run: |
          # Run every type even if one fails, so the log shows which
          # specific attribute types pass and which fail.  The step
          # still fails at the end if any single type failed.
          declare -A RESULT
          FAILED=()
          for t in string number binary bool null string-set number-set binary-set list map; do
            echo "::group::value-type=${t}"
            set +e
            timeout 120 ~/lein run -m elastickv.dynamodb-types-workload --local \
              --time-limit 5 --rate 5 --concurrency 4 \
              --value-type "${t}" \
              --dynamo-ports 63801,63802,63803 --host 127.0.0.1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              RESULT[$t]="pass"
            else
              RESULT[$t]="fail(${rc})"
              FAILED+=("$t")
            fi
            echo "::endgroup::"
          done
          echo
          echo "=== per-type jepsen summary ==="
          for t in string number binary bool null string-set number-set binary-set list map; do
            printf '  %-12s %s\n' "$t" "${RESULT[$t]}"
          done
          if [ ${#FAILED[@]} -ne 0 ]; then
            echo "FAILED types: ${FAILED[*]}"
            exit 1
          fi
      - name: Archive Jepsen store on per-type failure
        if: failure()
        run: bash scripts/archive-jepsen-store.sh jepsen/store /tmp/jepsen-store-types.tar.gz
      - name: Upload Jepsen store on per-type failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jepsen-store-types-encryption-${{ matrix.encryption }}
          path: /tmp/jepsen-store-types.tar.gz
          retention-days: 7
      - name: Run S3 Jepsen workload against elastickv
        working-directory: jepsen
        timeout-minutes: 3
        run: |
          timeout 120 ~/lein run -m elastickv.s3-workload --local --time-limit 5 --rate 10 --concurrency 10 --s3-ports 63901,63902,63903 --host 127.0.0.1
      - name: Run SQS HT-FIFO Jepsen workload against elastickv
        working-directory: jepsen
        # The HT-FIFO workload runs sends and receives across a 4-partition
        # FIFO queue with content-based deduplication. The custom checker
        # validates within-group ordering, no loss, and no duplicates.
        # See jepsen/src/elastickv/sqs_htfifo_workload.clj.
        #
        # --drain-time 15: in --local mode the nemesis is a no-op, so no
        # message can become invisible due to partition/kill — the 40s
        # default drain (which protects against fault-induced
        # visibility-timeout races) is overkill here. 15s leaves ample
        # headroom under the 120s shell timeout against JVM startup and
        # the 5s main phase.
        timeout-minutes: 3
        run: |
          timeout 120 ~/lein run -m elastickv.sqs-htfifo-workload --local \
            --time-limit 5 --rate 5 --concurrency 5 \
            --partition-count 4 --group-count 6 \
            --drain-time 15 \
            --sqs-ports 63501,63502,63503 --host 127.0.0.1
      - name: Run filesystem Jepsen workloads against elastickv
        working-directory: jepsen
        # Linearizable register over the FUSE mounts: every node mounts the
        # same filesystem, and each key is one file. `overwrite` writes the
        # record in place (one chunk RMW); `rename` replaces it through a
        # temp file + rename (namespace txn and remove-while-open). Both run
        # even if one fails so the log shows which mode broke.
        # See jepsen/src/elastickv/filesystem_workload.clj.
        timeout-minutes: 10
        run: |
          declare -A RESULT
          FAILED=()
          for mode in overwrite rename; do
            echo "::group::write-mode=${mode}"
            set +e
            timeout 240 ~/lein run -m elastickv.filesystem-workload --local \
              --time-limit 30 --rate 5 --concurrency 6 \
              --write-mode "${mode}" \
              --mount-dirs /tmp/elastickv-ci/fs-n1,/tmp/elastickv-ci/fs-n2,/tmp/elastickv-ci/fs-n3
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              RESULT[$mode]="pass"
            else
              RESULT[$mode]="fail(${rc})"
              FAILED+=("$mode")
            fi
            echo "::endgroup::"
          done
          echo
          echo "=== filesystem jepsen summary ==="
          for mode in overwrite rename; do
            printf '  %-10s %s\n' "$mode" "${RESULT[$mode]}"
          done
          if [ ${#FAILED[@]} -ne 0 ]; then
            echo "FAILED modes: ${FAILED[*]}"
            exit 1
          fi
      - name: Run SQLite Jepsen workload on FUSE
        working-directory: jepsen
        timeout-minutes: 6
        run: |
          probe=/tmp/elastickv-ci/fs-n1/sqlite-probe.db
          if ! strace -f -o /tmp/elastickv-sqlite.strace sqlite3 "$probe" \
              'PRAGMA journal_mode=PERSIST; PRAGMA synchronous=FULL; CREATE TABLE probe (value INTEGER); INSERT INTO probe VALUES (1);'; then
            tail -n 160 /tmp/elastickv-sqlite.strace
            exit 1
          fi
          if ! strace -f -o /tmp/elastickv-sqlite.strace sqlite3 /tmp/elastickv-ci/fs-n2/sqlite-probe.db \
              'PRAGMA journal_mode=PERSIST; PRAGMA synchronous=FULL; BEGIN IMMEDIATE; UPDATE probe SET value=2; COMMIT;'; then
            tail -n 160 /tmp/elastickv-sqlite.strace
            exit 1
          fi
          for node in 1 2 3; do
            if ! actual=$(strace -f -o /tmp/elastickv-sqlite.strace sqlite3 -batch -noheader \
                "/tmp/elastickv-ci/fs-n${node}/sqlite-probe.db" \
                'PRAGMA journal_mode=PERSIST; SELECT value FROM probe;'); then
              tail -n 160 /tmp/elastickv-sqlite.strace
              exit 1
            fi
            if [[ "$actual" != $'persist\n2' ]]; then
              printf 'SQLite probe on n%s: expected PERSIST mode and value 2, got %q\n' "$node" "$actual" >&2
              tail -n 160 /tmp/elastickv-sqlite.strace
              exit 1
            fi
          done
          timeout 240 ~/lein run -m elastickv.sqlite-workload --local \
            --time-limit 30 --rate 5 --concurrency 6 \
            --key-count 12 --max-writes-per-key 16 \
            --mount-dirs /tmp/elastickv-ci/fs-n1,/tmp/elastickv-ci/fs-n2,/tmp/elastickv-ci/fs-n3
      - name: Archive Jepsen store on filesystem failure
        if: failure()
        run: bash scripts/archive-jepsen-store.sh jepsen/store /tmp/jepsen-store-filesystem.tar.gz
      - name: Upload Jepsen store on filesystem failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jepsen-store-filesystem-encryption-${{ matrix.encryption }}
          path: /tmp/jepsen-store-filesystem.tar.gz
          retention-days: 7
          if-no-files-found: ignore
      - name: Dump demo cluster logs on failure
        if: failure()
        # Same rationale as jepsen-test-scheduled.yml: inline summary
        # for the GH UI + full per-node logs uploaded as artifact so
        # any Jepsen anomaly can be traced to the server-side ts/raft
        # state without re-running the workflow.
        run: |
          for node in n1 n2 n3; do
            log=/tmp/elastickv-demo-${node}.log
            echo "=== ${node}: first 200 lines (startup) ==="
            head -n 200 "$log" || true
            echo "=== ${node}: last 500 lines (most recent activity) ==="
            tail -n 500 "$log" || true
            echo "=== ${node}: full log line count ==="
            wc -l "$log" || true
          done
      - name: Upload demo cluster logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: elastickv-demo-logs-encryption-${{ matrix.encryption }}
          path: |
            /tmp/elastickv-demo-n1.log
            /tmp/elastickv-demo-n2.log
            /tmp/elastickv-demo-n3.log
          retention-days: 14
          if-no-files-found: warn
      - name: Stop demo cluster
        if: always()
        run: |
          if [ -f /tmp/elastickv-demo.pid ]; then
            while read -r pid; do
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            done < /tmp/elastickv-demo.pid
          fi
          for node in 1 2 3; do
            fusermount3 -uz "/tmp/elastickv-ci/fs-n${node}" 2>/dev/null || true
          done
