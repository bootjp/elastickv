name: Update review approval label

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed, labeled]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Review approval events, Claude Code]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: review-approval-label
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
        github.event.comment.user.login == 'claude[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This job can write labels. Never check out or execute the PR's code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const { run } = require('./.github/scripts/review-approval-label.cjs');
            await run({ github, context, core });
