name: Reviewdog

on:
  pull_request:
    types: [ opened, synchronize ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-reviewdog
#  cancel-in-progress: true

jobs:
  golangci-lint:
    name: golangci-lint
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - name: Install golangci-lint
        run: |
          GOBIN="$(go env GOPATH)/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run golangci-lint
        run: golangci-lint run --config=.golangci.yaml --new-from-rev=origin/main
      - name: golangci-lint
        continue-on-error: true
        uses: reviewdog/action-golangci-lint@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          golangci_lint_version: "v2.15.0"
          level: warning
          golangci_lint_flags: "--config=.golangci.yaml --new-from-rev=origin/main"
          filter_mode: nofilter
          reporter: github-pr-review
          cache: false
          fail_on_error: false
