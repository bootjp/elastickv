apiVersion: v1
kind: Service
metadata:
  name: elastickv-peer
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: elastickv
  ports:
    - name: raft
      port: 50051
      targetPort: raft
---
apiVersion: v1
kind: Service
metadata:
  name: elastickv
spec:
  selector:
    app.kubernetes.io/name: elastickv
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: dynamodb
      port: 8000
      targetPort: dynamodb
---
apiVersion: v1
kind: Service
metadata:
  name: elastickv-control
spec:
  selector:
    app.kubernetes.io/name: elastickv
  ports:
    - name: raft-admin
      port: 50051
      targetPort: raft
