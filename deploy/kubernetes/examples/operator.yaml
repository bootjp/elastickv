# Optional operational tooling, not part of the base deployment.
# Restrict access to this namespace and the namespace-label permission with RBAC.
apiVersion: v1
kind: Namespace
metadata:
  name: elastickv-ops
  labels:
    elastickv-operator: "true"
---
apiVersion: v1
kind: Pod
metadata:
  name: elastickv-operator
  namespace: elastickv-ops
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: tools
      image: busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: [sleep, "86400"]
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 128Mi
      volumeMounts:
        - name: tools
          mountPath: /tmp
  volumes:
    - name: tools
      emptyDir:
        sizeLimit: 128Mi
