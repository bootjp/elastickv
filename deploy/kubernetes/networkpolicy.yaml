apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elastickv
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: elastickv
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: elastickv
      ports:
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              elastickv-client: "true"
      ports:
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 8000
