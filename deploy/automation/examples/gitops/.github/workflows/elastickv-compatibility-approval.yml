name: Review Elastickv compatibility approval
on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      promote:
        type: boolean
        default: false
  pull_request:
    paths:
      - 'apps/elastickv-release/policy.json'
      - 'docs/operations/elastickv-compatibility/**'
      - 'automation/**'
      - '.github/workflows/elastickv-compatibility-approval.yml'
env:
  PIP_INDEX_URL: https://pypi.flatt.tech/simple/
  PIP_CONFIG_FILE: /dev/null
  PIP_EXTRA_INDEX_URL: ''
  PIP_FIND_LINKS: ''
  ELASTICKV_DEPLOYMENT_CONFIG: automation/deployment.json
permissions:
  contents: read
concurrency:
  group: elastickv-review-${{ inputs.pr_number || github.event.pull_request.number }}-${{ inputs.promote || false }}
  cancel-in-progress: false
jobs:
  offline-proposal-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # actions/setup-python v7.1.0; PyYAML 6.0.3 has CPython 3.14 wheels.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Create isolated Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/guard-python"
          echo "$RUNNER_TEMP/guard-python/bin" >> "$GITHUB_PATH"
      - run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r automation/requirements-parser.lock
          ELASTICKV_DEPLOYMENT_CONFIG='' python3 -m unittest discover -s automation -v
  compatibility-review:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      # actions/setup-python v7.1.0; PyYAML 6.0.3 has CPython 3.14 wheels.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Create isolated Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/guard-python"
          echo "$RUNNER_TEMP/guard-python/bin" >> "$GITHUB_PATH"
      - name: Test trusted controller and review gates
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r automation/requirements-parser.lock
          ELASTICKV_DEPLOYMENT_CONFIG='' python3 -m unittest discover -s automation -v
      - name: Revalidate immutable proposal and record exact-head check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: python3 automation/compatibility_pr.py check --pr "$PR_NUMBER" --head "$HEAD_SHA"
  merge-qualified:
    if: github.event_name == 'workflow_dispatch' && inputs.promote
    needs: compatibility-review
    permissions:
      contents: write
      pull-requests: read
      checks: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      # actions/setup-python v7.1.0; PyYAML 6.0.3 has CPython 3.14 wheels.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Create isolated Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/guard-python"
          echo "$RUNNER_TEMP/guard-python/bin" >> "$GITHUB_PATH"
      - run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r automation/requirements-parser.lock
      - name: Recheck human consent and merge only the reviewed head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: python3 automation/compatibility_pr.py merge --pr "$PR_NUMBER" --head "$HEAD_SHA"
