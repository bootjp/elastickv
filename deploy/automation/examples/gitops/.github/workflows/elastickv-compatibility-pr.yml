name: Open qualified Elastickv proposal
on:
  repository_dispatch:
    types: [elastickv-compatibility-qualified]
env:
  PIP_INDEX_URL: https://pypi.flatt.tech/simple/
  PIP_CONFIG_FILE: /dev/null
  PIP_EXTRA_INDEX_URL: ''
  PIP_FIND_LINKS: ''
  ELASTICKV_DEPLOYMENT_CONFIG: automation/deployment.json
permissions:
  contents: read
  pull-requests: write
  actions: write
  checks: read
concurrency:
  group: elastickv-qualification-${{ github.event.client_payload.branch }}
  cancel-in-progress: false
jobs:
  proposal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      # actions/setup-python v7.1.0; match the locked parser wheels.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Create isolated Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/guard-python"
          echo "$RUNNER_TEMP/guard-python/bin" >> "$GITHUB_PATH"
      - name: Install runtime parser
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r automation/requirements-parser.lock
      - name: Revalidate machine branch and create its bounded PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUAL_BRANCH: ${{ github.event.client_payload.branch }}
          QUAL_HEAD: ${{ github.event.client_payload.head }}
        run: python3 automation/compatibility_pr.py request --branch "$QUAL_BRANCH" --head "$QUAL_HEAD"
