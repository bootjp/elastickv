apiVersion: v1
kind: Namespace
metadata:
  name: elastickv-validation
  labels:
    elastickv-validation: compatibility
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: validation-budget
  namespace: elastickv-validation
spec:
  hard:
    pods: '8'
    persistentvolumeclaims: '3'
    requests.storage: 3Gi
    requests.cpu: '2'
    requests.memory: 2Gi
    limits.cpu: '4'
    limits.memory: 4Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: compatibility-validator
  namespace: elastickv-validation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: compatibility-validator
  namespace: elastickv-validation
rules:
- apiGroups:
  - apps
  resources:
  - statefulsets
  resourceNames:
  - elastickv
  verbs:
  - get
  - patch
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - list
- apiGroups:
  - ''
  resources:
  - pods
  resourceNames:
  - elastickv-0
  - elastickv-1
  - elastickv-2
  verbs:
  - get
  - delete
- apiGroups:
  - ''
  resources:
  - persistentvolumeclaims
  resourceNames:
  - data-elastickv-0
  - data-elastickv-1
  - data-elastickv-2
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - elastickv-api-credentials
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - configmaps
  resourceNames:
  - validation-evidence
  verbs:
  - get
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  resourceNames:
  - elastickv-release
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: compatibility-validator
  namespace: elastickv-validation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: compatibility-validator
subjects:
- kind: ServiceAccount
  name: compatibility-validator
  namespace: elastickv-validation
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: servers-isolated
  namespace: elastickv-validation
spec:
  podSelector: &id001
    matchLabels:
      app.kubernetes.io/name: elastickv
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - &id002
      podSelector: *id001
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: elastickv-compatibility-validator
    ports: &id003
    - protocol: TCP
      port: 50051
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 9000
    - protocol: TCP
      port: 9324
    - protocol: TCP
      port: 8081
  egress:
  - to:
    - *id002
    ports: *id003
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: validator-isolated
  namespace: elastickv-validation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: elastickv-compatibility-validator
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: elastickv
    ports:
    - protocol: TCP
      port: 50051
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 9000
    - protocol: TCP
      port: 9324
    - protocol: TCP
      port: 8081
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
---
apiVersion: v1
kind: Service
metadata:
  name: elastickv-peer
  namespace: elastickv-validation
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: elastickv
  ports:
  - name: raft
    port: 50051
    targetPort: raft
---
apiVersion: v1
kind: Service
metadata:
  name: elastickv
  namespace: elastickv-validation
spec:
  selector:
    app.kubernetes.io/name: elastickv
  ports:
  - name: redis
    port: 6379
    targetPort: redis
  - name: dynamodb
    port: 8000
    targetPort: dynamodb
  - name: s3
    port: 9000
    targetPort: s3
  - name: sqs
    port: 9324
    targetPort: sqs
---
apiVersion: v1
kind: Service
metadata:
  name: elastickv-control
  namespace: elastickv-validation
spec:
  selector:
    app.kubernetes.io/name: elastickv
  ports:
  - name: raft-admin
    port: 50051
    targetPort: raft
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-elastickv-0
  namespace: elastickv-validation
  labels:
    elastickv-validation: rollback-20261111213000
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: validation-storage
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-elastickv-1
  namespace: elastickv-validation
  labels:
    elastickv-validation: rollback-20261111213000
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: validation-storage
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-elastickv-2
  namespace: elastickv-validation
  labels:
    elastickv-validation: rollback-20261111213000
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: validation-storage
  resources:
    requests:
      storage: 1Gi
