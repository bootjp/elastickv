apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- sandbox.yaml
- rbac.yaml
- controller.yaml
- network.yaml
configMapGenerator:
- name: elastickv-compatibility-policy
  namespace: elastickv-system
  files:
  - policy.json
  - assets.json
generatorOptions:
  disableNameSuffixHash: true
