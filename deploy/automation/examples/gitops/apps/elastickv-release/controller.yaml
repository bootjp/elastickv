  namespace: elastickv-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: elastickv-release
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: elastickv
      podSelector:
        matchLabels:
          app.kubernetes.io/name: elastickv
    ports:
    - protocol: TCP
      port: 50051
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 9000
    - protocol: TCP
      port: 9324
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
