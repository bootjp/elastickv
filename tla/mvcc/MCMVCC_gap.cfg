\* TLC config: MVCC gap model — EnableSafety = FALSE.  PruneKey drops
\* every version at or below the pending watermark INCLUDING the newest
\* one.  TLC is expected to FAIL the MVCC4_NoLostCommitOnSnapshotInstall
\* invariant and emit a counterexample (a key written below the
\* watermark, no later write, and a read at read_ts >= the watermark
\* that would now miss the value).
\*
\* The make tla-check harness inverts the exit code for this config AND
\* greps for the specific MVCC-4 violation string, so any other failure
\* mode (parse error, deadlock, JVM crash, different invariant) fails
\* rather than being silently treated as the expected counterexample.

SPECIFICATION Spec

CONSTANTS
    Keys = {k1, k2}
    Vals = {v1, v2}
    MaxTs = 4
    MaxOps = 3
    EnableSafety = FALSE
    UniqueTs = TRUE

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    MVCC1_VisibleVersionUnique
    MVCC4_NoLostCommitOnSnapshotInstall
    MVCC5_AckedWriteNotOverwritten

PROPERTIES
    MVCC_TsMonotonic
    MVCC_GhostMonotonic
    MVCC_WatermarkMonotonic

CONSTRAINT StateConstraint

CHECK_DEADLOCK
    FALSE
