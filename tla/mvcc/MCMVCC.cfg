\* TLC config: MVCC safety model — resumable compaction with the
\* "keep the newest version <= minTS" rule, unique write timestamps.
\* Expected outcome: TLC finds no invariant violation.

SPECIFICATION Spec

CONSTANTS
    Keys = {k1, k2}
    Vals = {v1, v2}
    MaxTs = 4
    MaxOps = 3
    EnableSafety = TRUE
    UniqueTs = TRUE

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    MVCC1_VisibleVersionUnique
    MVCC4_NoLostCommitOnSnapshotInstall
    MVCC5_AckedWriteNotOverwritten

PROPERTIES
    MVCC_TsMonotonic
    MVCC_GhostMonotonic
    MVCC_WatermarkMonotonic

CONSTRAINT StateConstraint

CHECK_DEADLOCK
    FALSE
