\* TLC config: known implementation gap — write timestamps can collide
\* (non-leader stamping, audit G10; see tla/hlc/MCHLC_legacy_sharded_gap.cfg)
\* and the raw apply path replaces the version already at that
\* (key, commit_ts).  Expected outcome: TLC FAILS
\* MVCC5_AckedWriteNotOverwritten (an acknowledged write disappears).
\*
\* Kept as an expected failure so that a fix (leader-only issuance, or
\* rejecting a write at an occupied (key, commit_ts)) turns this run into
\* "unexpectedly passed" and forces the model and this config to be
\* updated.

SPECIFICATION Spec

CONSTANTS
    Keys = {k1, k2}
    Vals = {v1, v2}
    MaxTs = 4
    MaxOps = 3
    EnableSafety = TRUE
    UniqueTs = FALSE

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    MVCC1_VisibleVersionUnique
    MVCC5_AckedWriteNotOverwritten

PROPERTIES
    MVCC_TsMonotonic
    MVCC_GhostMonotonic
    MVCC_WatermarkMonotonic

CONSTRAINT StateConstraint

CHECK_DEADLOCK
    FALSE
