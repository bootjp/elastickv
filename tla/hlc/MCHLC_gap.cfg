\* TLC config: HLC gap model — centralized TSO mode with the
\* allocation-floor handoff disabled (EnableSafety = FALSE).  Expected
\* outcome: TLC FAILS the HLC4_NoRegressionAcrossTerms invariant and
\* emits a counterexample trace: a new leader floors to the same
\* ceiling and reissues a value the previous term already handed out.
\* This is the evidence that the committed floor is what carries the
\* in-memory logical half across a leader change.
\*
\* The make tla-check target inverts the exit code for this config so a
\* TLC FAILURE here counts as PASS for CI.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2, n3}
    MaxClockSkewMs = 1
    HlcPhysicalWindowMs = 2
    MaxTerms = 2
    MaxOps = 3
    MaxWallTime = 3
    LogicalMax = 1
    EnableSafety = FALSE
    IssuanceMode = "tso"

SYMMETRY NodeSymmetry

INVARIANTS
    TypeOK
    HLC1_PerNodeMonotonic
    HLC2_NonNeg
    HLC3_LeaderOnly
    HLC4_NoRegressionAcrossTerms

PROPERTIES
    HLC1_Action
    HLC2_Action

CONSTRAINT StateConstraint

CHECK_DEADLOCK
    FALSE
