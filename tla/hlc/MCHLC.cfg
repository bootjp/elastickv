\* TLC config: HLC safety model — centralized TSO mode (kv/tso_raft.go)
\* with the allocation-floor handoff, the NextFenced ceiling fence and
\* the bounded-skew ASSUME.  Expected outcome: TLC explores the bounded
\* state space and finds no invariant violation, i.e. HLC-1..HLC-4 hold
\* for the timestamp path the implementation provides in TSO mode.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2, n3}
    MaxClockSkewMs = 1
    HlcPhysicalWindowMs = 2
    MaxTerms = 2
    MaxOps = 3
    MaxWallTime = 3
    LogicalMax = 1
    EnableSafety = TRUE
    IssuanceMode = "tso"

SYMMETRY NodeSymmetry

INVARIANTS
    TypeOK
    HLC1_PerNodeMonotonic
    HLC2_NonNeg
    HLC3_LeaderOnly
    HLC4_NoRegressionAcrossTerms

PROPERTIES
    HLC1_Action
    HLC2_Action

CONSTRAINT StateConstraint

CHECK_DEADLOCK
    FALSE
