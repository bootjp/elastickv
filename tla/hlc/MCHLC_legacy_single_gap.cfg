\* TLC config: known implementation gap — the non-sharded Coordinate
\* (kv/coordinator.go, used by the demo) issues from the leader's own HLC
\* and nothing carries the logical half across a leader change: there is
\* no election-time Observe and no committed floor.  Expected outcome:
\* TLC FAILS HLC4_NoRegressionAcrossTerms (a new leader reissues a value
\* the previous term handed out).
\*
\* Kept as an expected failure so that a fix (an election-time handoff or
\* routing Coordinate through the TSO) turns this run into "unexpectedly
\* passed" and forces the model and this config to be updated.

SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2, n3}
    MaxClockSkewMs = 1
    HlcPhysicalWindowMs = 2
    MaxTerms = 2
    MaxOps = 3
    MaxWallTime = 3
    LogicalMax = 1
    EnableSafety = TRUE
    IssuanceMode = "legacy_single"

SYMMETRY NodeSymmetry

INVARIANTS
    TypeOK
    HLC1_PerNodeMonotonic
    HLC2_NonNeg
    HLC3_LeaderOnly
    HLC4_NoRegressionAcrossTerms

PROPERTIES
    HLC1_Action
    HLC2_Action

CONSTRAINT StateConstraint

CHECK_DEADLOCK
    FALSE
