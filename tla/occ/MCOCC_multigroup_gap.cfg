\* TLC config: known implementation gap — G0 across groups
\* (docs/design/2026_09_26_proposed_serializable_isolation_audit.md,
\* "Multi-group deployments").  Single-shard one-phase transactions only,
\* one Raft group per key.  The one-phase fence compares commit_ts with
\* the applying group's own watermark, but a snapshot start is the
\* maximum over all groups, so a write allocated earlier and applied
\* later on a lagging group lands below a reader's snapshot after the
\* read.  Expected outcome: TLC FAILS OCC3_ReadSnapshotStability.
\*
\* Kept as an expected failure so that the fix (a per-group snapshot or
\* the watermark-advance read path) turns this run into "unexpectedly
\* passed" and forces the model and this config to be updated.

SPECIFICATION Spec

CONSTANTS
    Keys = {k1, k2}
    TxnIds = {t1, t2}
    MaxTs = 6
    MaxOps = 3
    EnableSafety = TRUE
    EnableTwoPhase = FALSE
    MultiGroup = TRUE

SYMMETRY Symmetry

INVARIANTS
    OCC3_ReadSnapshotStability

PROPERTIES
    OCC5_Action
    CommitTsAssignedOnce

CONSTRAINT StateConstraint

\* Quiescence is a valid end state, not a deadlock.
CHECK_DEADLOCK
    FALSE
