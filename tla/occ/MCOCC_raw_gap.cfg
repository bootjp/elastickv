\* TLC config: known implementation gap: raw writes are not fenced in
\* the default build (--commitTSFence off).  Single-shard path, one Raft
\* group, CommitFence = FALSE: the coordinator allocates a raw timestamp
\* before proposing, so two raw entries can apply out of timestamp order
\* and the later-allocated one raises the watermark first; a reader at
\* that watermark misses the earlier one, which then lands below its
\* snapshot.  Expected outcome: TLC FAILS OCC3_ReadSnapshotStability.
\* MCOCC_onephase.cfg is the same with the fence on, and passes.

SPECIFICATION Spec

CONSTANTS
    Keys = {k1, k2}
    TxnIds = {t1, t2}
    MaxTs = 6
    MaxOps = 3
    EnableSafety = TRUE
    EnableTwoPhase = FALSE
    MultiGroup = FALSE
    ReadAdvance = FALSE
    CommitFence = FALSE

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    OCC1_CommitTsAboveStart
    OCC2_NoWriteWriteConflict
    OCC3_ReadSnapshotStability
    OCC4_NoStrandedLockAtQuiescence
    OCC5_StartTsConsistency
    OCC8_NoWriteSkew

PROPERTIES
    OCC5_Action
    CommitTsAssignedOnce

CONSTRAINT StateConstraint

\* Quiescence is a valid end state, not a deadlock.
CHECK_DEADLOCK
    FALSE
