\* TLC config: G0 across groups closed by the read watermark advance
\* (--readWatermarkAdvance; docs/design/2026_09_26_partial_serializable_isolation_audit.md,
\* "Partial implementation").  Same setup as MCOCC_multigroup_gap.cfg
\* (single-shard one-phase transactions, one Raft group per key), with
\* ReadAdvance = TRUE: a snapshot read first raises the read key's group
\* watermark to start_ts, so a write allocated earlier and applied later
\* on that group is fenced.  Expected outcome: TLC passes every invariant.

SPECIFICATION Spec

CONSTANTS
    Keys = {k1, k2}
    TxnIds = {t1, t2}
    MaxTs = 6
    MaxOps = 3
    EnableSafety = TRUE
    EnableTwoPhase = FALSE
    MultiGroup = TRUE
    ReadAdvance = TRUE
    CommitFence = TRUE

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    OCC1_CommitTsAboveStart
    OCC2_NoWriteWriteConflict
    OCC3_ReadSnapshotStability
    OCC4_NoStrandedLockAtQuiescence
    OCC5_StartTsConsistency
    OCC8_NoWriteSkew

PROPERTIES
    OCC5_Action
    CommitTsAssignedOnce

CONSTRAINT StateConstraint

\* Quiescence is a valid end state, not a deadlock.
CHECK_DEADLOCK
    FALSE
