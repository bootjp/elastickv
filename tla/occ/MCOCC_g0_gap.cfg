\* TLC config: known implementation gap G0
\* (docs/design/2026_09_26_proposed_serializable_isolation_audit.md).
\* A 2PC commit_ts is settled before PREPARE and COMMIT applies it with
\* no watermark fence, so a reader whose watermark snapshot already
\* passed that commit_ts can read a key, then see the 2PC write appear
\* below its snapshot.  Expected outcome: TLC FAILS
\* OCC3_ReadSnapshotStability.
\*
\* Kept as an expected failure so that the fix (A0) turns this run into
\* "unexpectedly passed" and forces the model and this config to be
\* updated.

SPECIFICATION Spec

CONSTANTS
    Keys = {k1, k2}
    TxnIds = {t1, t2}
    MaxTs = 6
    MaxOps = 3
    EnableSafety = TRUE
    EnableTwoPhase = TRUE

SYMMETRY Symmetry

INVARIANTS
    OCC3_ReadSnapshotStability

PROPERTIES
    OCC5_Action
    CommitTsAssignedOnce

CONSTRAINT StateConstraint

\* Quiescence is a valid end state, not a deadlock.
CHECK_DEADLOCK
    FALSE
