\* TLC config: G0 closed by the apply-order fence (--commitTSFence;
\* docs/design/2026_09_26_partial_serializable_isolation_audit.md, "Raw
\* and 2PC apply-order fence").  The full model (one-phase, 2PC, raw), one
\* Raft group, CommitFence = TRUE: a PREPARE whose settled commit_ts is at
\* or below the group watermark is rejected, and so is a raw entry at or
\* below it.  Expected outcome: TLC passes every invariant listed, including
\* OCC-3.  OCC-8 is not listed: G1 is independent of the fence and stays
\* pinned by MCOCC_g1_gap.cfg.

SPECIFICATION Spec

CONSTANTS
    Keys = {k1, k2}
    TxnIds = {t1, t2}
    MaxTs = 6
    MaxOps = 3
    EnableSafety = TRUE
    EnableTwoPhase = TRUE
    MultiGroup = FALSE
    ReadAdvance = FALSE
    CommitFence = TRUE

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    OCC1_CommitTsAboveStart
    OCC2_NoWriteWriteConflict
    OCC3_ReadSnapshotStability
    OCC4_NoStrandedLockAtQuiescence
    OCC5_StartTsConsistency

PROPERTIES
    OCC5_Action
    CommitTsAssignedOnce

CONSTRAINT StateConstraint

\* Quiescence is a valid end state, not a deadlock.
CHECK_DEADLOCK
    FALSE
