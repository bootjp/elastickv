\* TLC config: OCC model of main — one-phase, 2PC and raw writes.
\* Expected outcome: TLC finds no violation of the invariants listed
\* here.  OCC-3 (snapshot stability) and OCC-8 (no write skew) are NOT
\* listed: main violates them through the 2PC path, and the two
\* known-gap configs (MCOCC_g0_gap.cfg, MCOCC_g1_gap.cfg) pin those
\* counterexamples.  MCOCC_onephase.cfg checks the full set on the
\* single-shard path.

SPECIFICATION Spec

CONSTANTS
    Keys = {k1, k2}
    TxnIds = {t1, t2}
    MaxTs = 6
    MaxOps = 3
    EnableSafety = TRUE
    EnableTwoPhase = TRUE
    MultiGroup = FALSE
    ReadAdvance = FALSE
    CommitFence = FALSE

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    OCC1_CommitTsAboveStart
    OCC2_NoWriteWriteConflict
    OCC4_NoStrandedLockAtQuiescence
    OCC5_StartTsConsistency

PROPERTIES
    OCC5_Action
    CommitTsAssignedOnce

CONSTRAINT StateConstraint

\* Quiescence is a valid end state, not a deadlock.
CHECK_DEADLOCK
    FALSE
