\* Multi-group 2PC with per-group read advancement and the PREPARE fence.
\* Checks whether a secondary can commit below a completed read snapshot.

SPECIFICATION Spec

CONSTANTS
    Keys = {k1, k2}
    TxnIds = {t1, t2}
    MaxTs = 6
    MaxOps = 3
    EnableSafety = TRUE
    EnableTwoPhase = TRUE
    MultiGroup = TRUE
    ReadAdvance = TRUE
    CommitFence = TRUE

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    OCC1_CommitTsAboveStart
    OCC2_NoWriteWriteConflict
    OCC3_ReadSnapshotStability
    OCC4_NoStrandedLockAtQuiescence
    OCC5_StartTsConsistency

PROPERTIES
    OCC5_Action
    CommitTsAssignedOnce

CONSTRAINT StateConstraint

CHECK_DEADLOCK
    FALSE
