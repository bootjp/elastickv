\* TLC config: known implementation gap — a transaction that starts on an
\* empty store gets start_ts = MaxUint64 from adapter/ts.go snapshotTS,
\* i.e. it reads the latest version rather than a snapshot.  A write
\* applied after its read is then visible at its start_ts.  Expected
\* outcome: TLC FAILS OCC3b_EmptyStoreReadStability.  Checked on the
\* single-shard path so the counterexample is not a 2PC (G0) trace.
\*
\* Kept as an expected failure so that a fix (a real snapshot timestamp
\* on an empty store) turns this run into "unexpectedly passed" and
\* forces the model and this config to be updated.

SPECIFICATION Spec

CONSTANTS
    Keys = {k1, k2}
    TxnIds = {t1, t2}
    MaxTs = 6
    MaxOps = 3
    EnableSafety = TRUE
    EnableTwoPhase = FALSE
    MultiGroup = FALSE
    ReadAdvance = FALSE
    CommitFence = FALSE

SYMMETRY Symmetry

INVARIANTS
    OCC3b_EmptyStoreReadStability

PROPERTIES
    OCC5_Action
    CommitTsAssignedOnce

CONSTRAINT StateConstraint

\* Quiescence is a valid end state, not a deadlock.
CHECK_DEADLOCK
    FALSE
