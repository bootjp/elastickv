\* TLC config: OCC model restricted to single-shard transactions
\* (EnableTwoPhase = FALSE): one-phase commits and raw writes.
\* Expected outcome: TLC passes every invariant, including OCC-3
\* (the commit-ts apply fence keeps apply order equal to commit-ts
\* order) and OCC-8 (read keys are validated atomically with the apply).
\* One Raft group (MultiGroup = FALSE); across groups the same path
\* fails, see MCOCC_multigroup_gap.cfg.

SPECIFICATION Spec

CONSTANTS
    Keys = {k1, k2}
    TxnIds = {t1, t2}
    MaxTs = 6
    MaxOps = 3
    EnableSafety = TRUE
    EnableTwoPhase = FALSE
    MultiGroup = FALSE

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    OCC1_CommitTsAboveStart
    OCC2_NoWriteWriteConflict
    OCC3_ReadSnapshotStability
    OCC4_NoStrandedLockAtQuiescence
    OCC5_StartTsConsistency
    OCC8_NoWriteSkew

PROPERTIES
    OCC5_Action
    CommitTsAssignedOnce

CONSTRAINT StateConstraint

\* Quiescence is a valid end state, not a deadlock.
CHECK_DEADLOCK
    FALSE
