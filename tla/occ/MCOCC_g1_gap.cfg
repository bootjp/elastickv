\* TLC config: known implementation gap G1
\* (docs/design/2026_09_26_partial_serializable_isolation_audit.md).
\* 2PC read keys are validated once at PREPARE and are not locked, so a
\* one-phase commit that writes them can apply between PREPARE and
\* COMMIT; both commit with rw edges in both directions.  Expected
\* outcome: TLC FAILS OCC8_NoWriteSkew.
\*
\* Kept as an expected failure so that the fix (A2 read locks) turns
\* this run into "unexpectedly passed" and forces the model and this
\* config to be updated.

SPECIFICATION Spec

CONSTANTS
    Keys = {k1, k2}
    TxnIds = {t1, t2}
    MaxTs = 6
    MaxOps = 3
    EnableSafety = TRUE
    EnableTwoPhase = TRUE
    MultiGroup = FALSE
    ReadAdvance = FALSE

SYMMETRY Symmetry

INVARIANTS
    OCC8_NoWriteSkew

PROPERTIES
    OCC5_Action
    CommitTsAssignedOnce

CONSTRAINT StateConstraint

\* Quiescence is a valid end state, not a deadlock.
CHECK_DEADLOCK
    FALSE
