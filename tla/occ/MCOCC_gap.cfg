\* TLC config: OCC gap model — EnableSafety = FALSE.  Commit timestamps
\* are no longer fresh and the FSM's commit_ts > start_ts check is
\* removed, so TLC is expected to FAIL on OCC1_CommitTsAboveStart.
\* This is the motivating evidence that the commit-ts gating is
\* necessary.
\*
\* The make tla-check target inverts the exit code for this config and
\* greps for the specific OCC-1 violation string, so any other failure
\* mode (parse error, deadlock, JVM crash, different invariant) fails
\* the harness rather than being silently treated as the expected
\* counterexample.

SPECIFICATION Spec

CONSTANTS
    Keys = {k1, k2}
    TxnIds = {t1, t2}
    MaxTs = 6
    MaxOps = 3
    EnableSafety = FALSE
    EnableTwoPhase = TRUE
    MultiGroup = FALSE
    ReadAdvance = FALSE

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    OCC1_CommitTsAboveStart

PROPERTIES
    OCC5_Action
    CommitTsAssignedOnce

CONSTRAINT StateConstraint

\* Quiescence is a valid end state, not a deadlock.
CHECK_DEADLOCK
    FALSE
